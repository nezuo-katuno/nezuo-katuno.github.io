<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Escolar Compartilhada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agenda Escolar</h1>
        <button id="btn-nova-atividade">+ Nova Atividade</button>
    </header>

    <main>
        <section id="lista-atividades" class="grid-atividades">
            <!-- As atividades aparecerão aqui via JavaScript -->
        </section>
    </main>

    <!-- Modal para adicionar atividade -->
    <div id="modal" class="modal oculto">
        <div class="modal-conteudo">
            <span class="fechar">&times;</span>
            <h2>Adicionar Atividade</h2>
            <form id="form-atividade">
                <label for="titulo">Título da Atividade:</label>
                <input type="text" id="titulo" required>

                <label for="materia">Matéria e Professor:</label>
                <select id="materia" required>
                    <!-- Preenchido via JS -->
                </select>

                <label for="prazo">Prazo (Data):</label>
                <input type="date" id="prazo" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" rows="4"></textarea>

                <label for="imagem">Anexar Imagem:</label>
                <input type="file" id="imagem" accept="image/*">

                <button type="submit" class="btn-salvar">Salvar Atividade</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
